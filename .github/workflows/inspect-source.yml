name: Inspect SEVA source bundle
on:
  push:
    branches: [ work/source-inspection ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project source
        run: |
          set -euo pipefail
          mkdir -p /tmp/seva-source
          cat .source-bundle/part-*.b64 | base64 --decode | tar -xz -C /tmp/seva-source
          echo "Extracted files:"
          find /tmp/seva-source -maxdepth 4 -type f -printf '%P (%s bytes)\n' | sort
          echo "Root files:"
          ls -la /tmp/seva-source
      - name: Upload extracted source for review
        uses: actions/upload-artifact@v4
        with:
          name: SEVA-Original-Source-For-Review
          path: /tmp/seva-source/
          if-no-files-found: error
          retention-days: 3
