name: Build SEVA Hardware installable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: seva-hardware-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            emulator

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Reassemble app source and tests
        run: |
          cat .source-bundle/part-*.b64 | base64 --decode | tar -xz
          node scripts/apply-app-updates.js

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run business logic and asset tests
        run: npm test

      - name: Validate app assets and JavaScript
        run: |
          node --check www/business-core.js
          node --check www/app.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          for (const asset of ['style.css', 'manifest.json', 'business-core.js', 'app.js']) {
            if (!html.includes(asset) || !fs.existsSync(`www/${asset}`)) throw new Error(`Missing app asset: ${asset}`);
          }
          for (const id of ['activeAccountLabel', 'logoutBtn', 'salePaidLabel', 'saleTaxable', 'saveSaleNew']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing required UI element: ${id}`);
          }
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package, signature and checksum
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.sevahardware.businessmanager'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"

      - name: Install and launch APK on Android emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.sevahardware.businessmanager
            adb install -r "$APK"
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 30); do
              PID="$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$PID" ]; then break; fi
              sleep 1
            done
            test -n "$PID"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F "$PKG"
            if adb logcat -d -t 4000 | grep -E "FATAL EXCEPTION|Process: $PKG"; then
              echo "App crashed during emulator launch"
              exit 1
            fi

      - name: Upload verified directly installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SEVA-Hardware-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
