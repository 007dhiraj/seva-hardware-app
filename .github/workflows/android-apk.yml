name: Build SEVA Hardware installable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: seva-hardware-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Reassemble app source and tests
        run: |
          cat .source-bundle/part-*.b64 | base64 --decode | tar -xz
          node scripts/apply-app-updates.js

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run business logic and asset tests
        run: npm test

      - name: Verify billing calculations, ledgers, stock and backup invariants
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const Core = require('./www/business-core.js');

          assert.equal(Core.financialYearCode('2026-03-31'), '25-26');
          assert.equal(Core.financialYearCode('2026-04-01'), '26-27');

          const invoice = Core.calculateInvoice(
            [{ name: 'Test item', qty: 2, price: 100, gst: 18 }],
            { taxEnabled: true, discountType: 'amount', discountValue: 20 }
          );
          assert.equal(invoice.subtotal, 200);
          assert.equal(invoice.discount, 20);
          assert.equal(invoice.taxable, 180);
          assert.equal(invoice.tax, 32.4);
          assert.equal(invoice.total, 212.4);

          const nonGst = Core.calculateInvoice(
            [{ qty: 1, price: 100, gst: 18 }],
            { taxEnabled: false }
          );
          assert.equal(nonGst.tax, 0);
          assert.equal(nonGst.total, 100);

          const balance = Core.partyBalance({ name: 'Customer' }, {
            sales: [{ party: 'Customer', total: 236, paid: 50, kind: 'cash' }],
            purchases: [{ party: 'Customer', total: 118, paid: 18 }],
            payments: [
              { party: 'Customer', kind: 'receipt', amount: 25 },
              { party: 'Customer', kind: 'payment', amount: 10 }
            ]
          });
          assert.equal(balance, 71);

          const stock = Core.stockOnHand({ id: 'p1', opening: 2 }, {
            purchases: [{ lines: [{ productId: 'p1', qty: 5 }] }],
            sales: [
              { kind: 'cash', lines: [{ productId: 'p1', qty: 3 }] },
              { kind: 'return', lines: [{ productId: 'p1', qty: 1 }] }
            ]
          });
          assert.equal(stock, 5);

          const products = [];
          const lines = [{ name: 'Purchased item', qty: 2, price: 80, gst: 18 }];
          Core.attachPurchasedProducts(products, lines, () => 'created-product');
          assert.equal(products.length, 1);
          assert.equal(lines[0].productId, 'created-product');

          const backup = Core.backupPayload(
            { phone: '9999999999', business: 'Test Shop', pin: '1234' },
            { sales: [] }
          );
          assert.equal(Object.hasOwn(backup.account, 'pin'), false);
          console.log('Billing core invariants passed.');
          NODE

      - name: Validate app assets and JavaScript
        run: |
          node --check www/business-core.js
          node --check www/app.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          for (const asset of ['style.css', 'manifest.json', 'business-core.js', 'app.js']) {
            if (!html.includes(asset) || !fs.existsSync(`www/${asset}`)) throw new Error(`Missing app asset: ${asset}`);
          }
          for (const id of ['activeAccountLabel', 'logoutBtn', 'salePaidLabel', 'saleTaxable', 'saveSaleNew']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing required UI element: ${id}`);
          }
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package, signature and checksum
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.sevahardware.businessmanager'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"

      - name: Install and launch APK on Android emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.sevahardware.businessmanager
            adb install -r "$APK"
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 30); do
              PID="$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$PID" ]; then break; fi
              sleep 1
            done
            test -n "$PID"
            sleep 3
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F "$PKG"
            if adb logcat -d -t 4000 | grep -F "Process: $PKG"; then
              echo "App crashed during emulator launch"
              exit 1
            fi

      - name: Upload verified directly installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SEVA-Hardware-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
