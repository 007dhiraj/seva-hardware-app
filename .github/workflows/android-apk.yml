name: Build Free Bill installable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: free-bill-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android emulator host dependencies
        run: |
          sudo apt-get update
          if apt-cache show libpulse0t64 >/dev/null 2>&1; then
            sudo apt-get install -y libpulse0t64
          else
            sudo apt-get install -y libpulse0
          fi

      - name: Install Android SDK platform, emulator and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-30;google_apis;x86_64"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Reassemble app source and tests
        run: |
          cat .source-bundle/part-*.b64 | base64 --decode | tar -xz
          node scripts/apply-app-updates.js

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run business logic and asset tests
        run: npm test

      - name: Verify billing calculations, ledgers, stock and backup invariants
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const Core = require('./www/business-core.js');

          assert.equal(Core.financialYearCode('2026-03-31'), '25-26');
          assert.equal(Core.financialYearCode('2026-04-01'), '26-27');

          const invoice = Core.calculateInvoice(
            [{ name: 'Test item', qty: 2, price: 100, gst: 18 }],
            { taxEnabled: true, discountType: 'amount', discountValue: 20 }
          );
          assert.equal(invoice.subtotal, 200);
          assert.equal(invoice.discount, 20);
          assert.equal(invoice.taxable, 180);
          assert.equal(invoice.tax, 32.4);
          assert.equal(invoice.total, 212.4);

          const nonGst = Core.calculateInvoice(
            [{ qty: 1, price: 100, gst: 18 }],
            { taxEnabled: false }
          );
          assert.equal(nonGst.tax, 0);
          assert.equal(nonGst.total, 100);

          const balance = Core.partyBalance({ name: 'Customer' }, {
            sales: [{ party: 'Customer', total: 236, paid: 50, kind: 'cash' }],
            purchases: [{ party: 'Customer', total: 118, paid: 18 }],
            payments: [
              { party: 'Customer', kind: 'receipt', amount: 25 },
              { party: 'Customer', kind: 'payment', amount: 10 }
            ]
          });
          assert.equal(balance, 71);

          const stock = Core.stockOnHand({ id: 'p1', opening: 2 }, {
            purchases: [{ lines: [{ productId: 'p1', qty: 5 }] }],
            sales: [
              { kind: 'cash', lines: [{ productId: 'p1', qty: 3 }] },
              { kind: 'return', lines: [{ productId: 'p1', qty: 1 }] }
            ]
          });
          assert.equal(stock, 5);

          const products = [];
          const lines = [{ name: 'Purchased item', qty: 2, price: 80, gst: 18 }];
          Core.attachPurchasedProducts(products, lines, () => 'created-product');
          assert.equal(products.length, 1);
          assert.equal(lines[0].productId, 'created-product');

          const backup = Core.backupPayload(
            { phone: '9999999999', business: 'Test Shop', pin: '1234' },
            { sales: [] }
          );
          assert.equal(Object.hasOwn(backup.account, 'pin'), false);
          console.log('Billing core invariants passed.');
          NODE

      - name: Validate app assets and JavaScript
        run: |
          node --check www/business-core.js
          node --check www/app.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          for (const asset of ['style.css', 'manifest.json', 'business-core.js', 'app.js']) {
            if (!html.includes(asset) || !fs.existsSync(`www/${asset}`)) throw new Error(`Missing app asset: ${asset}`);
          }
          for (const id of ['activeAccountLabel', 'logoutBtn', 'salePaidLabel', 'saleTaxable', 'saveSaleNew']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing required UI element: ${id}`);
          }
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package, signature and checksum
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.sevahardware.businessmanager'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"

      - name: Install and launch APK on Android emulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          AVD=freebill-ci
          SERIAL=emulator-5554
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          PKG=com.sevahardware.businessmanager
          IMAGE="system-images;android-30;google_apis;x86_64"

          echo "no" | avdmanager create avd --name "$AVD" --package "$IMAGE" --device "pixel_2" --force
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD" -port 5554 \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio \
            -no-boot-anim -no-metrics -memory 2048 -cores 2 \
            > "$RUNNER_TEMP/freebill-emulator.log" 2>&1 &
          trap 'adb -s "$SERIAL" emu kill >/dev/null 2>&1 || true' EXIT

          adb wait-for-device
          BOOT=""
          for attempt in $(seq 1 600); do
            BOOT="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 1
          done
          if [ "$BOOT" != "1" ]; then
            echo "Android emulator did not finish booting"
            tail -n 100 "$RUNNER_TEMP/freebill-emulator.log" || true
            exit 1
          fi

          adb -s "$SERIAL" shell input keyevent 82 || true
          adb -s "$SERIAL" install -r "$APK"
          adb -s "$SERIAL" shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1

          PID=""
          for attempt in $(seq 1 45); do
            PID="$(adb -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$PID" ]; then break; fi
            sleep 1
          done
          if [ -z "$PID" ]; then
            adb -s "$SERIAL" logcat -d -t 5000 | tail -n 200
            echo "Free Bill process did not remain running after launch"
            exit 1
          fi

          sleep 5
          adb -s "$SERIAL" shell pm path "$PKG" | grep -F "package:"
          FOREGROUND="$(adb -s "$SERIAL" shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true)"
          echo "$FOREGROUND"
          echo "$FOREGROUND" | grep -F "$PKG"
          CRASH="$(adb -s "$SERIAL" logcat -d -t 5000 | grep -E 'FATAL EXCEPTION|Process: com\\.sevahardware\\.businessmanager' || true)"
          if [ -n "$CRASH" ]; then
            echo "$CRASH"
            echo "Free Bill crashed during emulator launch"
            exit 1
          fi
          echo "Free Bill installed and remained in the foreground without a startup crash."

      - name: Upload verified installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Free-Bill-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
